[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmstf"
version = "2.1.0"
description = "Boundary-marginalised shear-trajectory forecasting for abdominal aortic aneurysm surveillance"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "BM-STF authors" }]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
bmstf-run = "bmstf.cli.run:main"
bmstf-evaluate = "bmstf.cli.evaluate:main"
bmstf-replay = "bmstf.cli.replay:main"
bmstf-verify = "bmstf.cli.verify:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["bmstf"]
combine_as_imports = true
force_sort_within_sections = false

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/bmstf"]
ignore_missing_imports = true
warn_unreachable = true
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
